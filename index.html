<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>BrilliantPala — Fullscreen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#08090d; }
    body { font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
    #app { position:fixed; inset:0; width:100vw; height:100dvh; background:#08090d; }
    #site { display:block; border:0; width:100%; height:100%; background:#fff; }
    #start {
      position:fixed; z-index:5; inset:0; display:grid; place-items:center;
      padding:24px; background:radial-gradient(ellipse at center,#202434,#08090d 70%);
      transition:opacity .2s ease;
    }
    #start.hidden { opacity:0; pointer-events:none; }
    .card { max-width:420px; text-align:center; }
    h1 { font-size:clamp(24px,6vw,36px); margin:0 0 10px; }
    p { color:#aeb5c5; line-height:1.5; margin:0 0 22px; }
    button { border:0; border-radius:14px; padding:15px 22px; color:#071018;
      background:#b7f36b; font-size:16px; font-weight:750; cursor:pointer; }
    #hint { position:fixed; z-index:4; left:50%; bottom:max(12px,env(safe-area-inset-bottom));
      transform:translateX(-50%); color:#fff; background:#10131dcc; border:1px solid #ffffff22;
      padding:8px 12px; border-radius:99px; font-size:12px; opacity:0; pointer-events:none; }
    #hint.show { opacity:1; }
    /* CSS fallback for browsers that cannot lock orientation. */
    @media (orientation:portrait) {
      #app.rotate-fallback { width:100dvh; height:100vw; left:0; top:100vw;
        transform-origin:top left; transform:rotate(-90deg); }
    }
  </style>
</head>
<body>
  <main id="app">
    <iframe id="site" title="BrilliantPala app"
      src="https://brilliantpala.base44.app/"
      allow="fullscreen; camera; microphone; geolocation; clipboard-read; clipboard-write"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <section id="start">
    <div class="card">
      <h1>BrilliantPala</h1>
      <p>Open the app in fullscreen. On supported phones, the screen will switch to landscape automatically.</p>
      <button id="launch" type="button">Open fullscreen</button>
    </div>
  </section>
  <div id="hint" role="status">Rotate your device to landscape for the best view.</div>
  <script>
    const app = document.getElementById('app');
    const start = document.getElementById('start');
    const launch = document.getElementById('launch');
    const hint = document.getElementById('hint');
    const frame = document.getElementById('site');
    let hintTimer;

    function showHint(message) {
      hint.textContent = message;
      hint.classList.add('show');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hint.classList.remove('show'), 2600);
    }

    async function enterExperience() {
      // Both operations must be initiated by the user's tap on browsers that enforce
      // fullscreen/orientation user-activation requirements.
      try {
        if (!document.fullscreenElement && app.requestFullscreen) {
          await app.requestFullscreen({ navigationUI: 'hide' });
        }
      } catch (error) {
        showHint('Fullscreen is unavailable in this browser.');
      }

      let locked = false;
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
          locked = true;
        }
      } catch (error) {
        // iOS Safari and some Android browsers do not expose orientation locking.
      }

      if (!locked && matchMedia('(orientation: portrait)').matches) {
        app.classList.add('rotate-fallback');
        showHint('Using landscape layout. Rotate your phone if needed.');
      } else {
        app.classList.remove('rotate-fallback');
      }
      start.classList.add('hidden');
    }

    launch.addEventListener('click', enterExperience);
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) start.classList.remove('hidden');
    });
    window.addEventListener('orientationchange', () => {
      if (matchMedia('(orientation: landscape)').matches) app.classList.remove('rotate-fallback');
      else if (!screen.orientation?.lock) app.classList.add('rotate-fallback');
    });
    window.addEventListener('resize', () => {
      if (matchMedia('(orientation: landscape)').matches) app.classList.remove('rotate-fallback');
    });

    // If the embedded site cannot be framed, browsers show their own refusal page;
    // that restriction is controlled by Base44's response headers, not this wrapper.
    frame.addEventListener('load', () => {});
  </script>
</body>
</html>
